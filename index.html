<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCP System - Auto Sync</title>
    
    <!-- PWA Meta Tags & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CCP Apps">
    <meta name="theme-color" content="#881337">
    
    <!-- Ikon PWA Baru -->

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        maroon: {
                            50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af',
                            400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c',
                            800: '#9f1239', 900: '#881337', 950: '#4c0519',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 15px rgba(225, 29, 72, 0.4)',
                        'glow-sm': '0 0 8px rgba(225, 29, 72, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        .bg-maroon-shine {
            background: linear-gradient(135deg, #881337 0%, #e11d48 50%, #881337 100%);
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-custom { animation: spin 1s linear infinite; }
        .accordion-content { transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out; overflow: hidden; }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkhN_Wny2yvarYD_cA5Ya0phmYFVqTZ1VRVwTKMAPIIPLc2X77_2GRIOqkv1PZRfEBlQ/exec";

        const LINE_OPTIONS = {
            "Stage 1": ["LINE 1", "LINE 2", "LINE 3", "LINE 4", "LINE 5", "ABON"],
            "Stage 2": ["LINE 1", "LINE 2", "LINE 3", "LINE 4", "LINE 5", "LINE MDC"]
        };

        const Icons = {
            Logo: () => (
                <svg viewBox="0 0 100 100" className="w-9 h-9 md:w-10 md:h-10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" rx="24" fill="url(#paint0_linear)" />
                    <path d="M42 35C38 35 34 38 34 42V58C34 62 38 65 42 65H46M58 35C54 35 50 38 50 42V58C50 62 54 65 58 65H62M76 35H72C68 35 64 38 64 42V58C64 62 68 65 72 65H76V50H72" stroke="white" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round"/>
                    <defs>
                        <linearGradient id="paint0_linear" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stopColor="#881337" />
                            <stop offset="0.5" stopColor="#e11d48" />
                            <stop offset="1" stopColor="#881337" />

            ),
            Home: () => <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a2 2 0 002 2h3m10-11l2 2m-2-2v10a2 2 0 01-2 2h-3m-6 0a2 2 0 002-2v-4a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 002 2m-6 0h6"/></svg>,
            Box: () => <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16zM3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>,
            Clipboard: () => <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>,
            Handshake: () => <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
            Refresh: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>,
            Alert: () => <svg className="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>,
            Search: () => <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>,
            CheckCircle: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Info: () => <svg className="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Close: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
            Logout: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,
            ChevronDown: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>,
            ChevronUp: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"/></svg>,
            WhatsApp: () => <svg className="w-4 h-4 md:w-5 md:h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        }

        const MessageBox = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-[80] fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl slide-up border border-slate-100">
                        <div className="flex items-center gap-3 mb-4">
                            <div className={`p-2 rounded-full ${message.type === 'error' ? 'bg-rose-100 text-rose-500' : 'bg-blue-100 text-blue-500'}`}>
                                {message.type === 'error' ? <Icons.Alert /> : <Icons.Info />}
                            </div>
                            <h3 className="text-base md:text-lg font-bold text-slate-800">{message.title}</h3>
                        </div>
                        <p className="text-sm md:text-base text-slate-600 mb-6 leading-relaxed font-medium">{message.text}</p>
                        <button onClick={onClose} className="w-full py-3 bg-maroon-shine text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 text-sm md:text-base">
                            Mengerti
                        </button>
                    </div>
                </div>
            );
        };

        const Login = ({ onLogin, showMessage }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!SCRIPT_URL || SCRIPT_URL === "ISI_URL_APPS_SCRIPT_ANDA_DISINI" || SCRIPT_URL.trim() === "") {
                    if (username === 'admin' && password === 'admin123') return onLogin('operator', username);
                    if (username === 'viewer' && password === 'viewer123') return onLogin('viewer', username);
                    showMessage('URL Dibutuhkan', 'URL Apps Script belum dipasang atau dibiarkan default. Gunakan akun lokal (admin / admin123) untuk masuk mode offline.', 'error');
                    return;
                }
                setLoading(true);
                try {
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'login', username, password }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        onLogin(data.role, username);
                    } else {
                        showMessage('Login Gagal', data.message, 'error');
                    }
                } catch(err) {
                    showMessage('Error Koneksi', 'Gagal menghubungi server. Periksa koneksi internet Anda atau gunakan kredensial lokal (admin / admin123).', 'error');
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-50 fade-in relative z-[100]">
                    <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100">
                        <div className="flex justify-center mb-5 md:mb-6"><Icons.Logo /></div>
                        <h2 className="text-xl md:text-2xl font-extrabold text-center text-slate-800 mb-6 tracking-tight">Login Sistem CCP</h2>
                        
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1">Username</label>
                                <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-maroon-500/50 bg-slate-50 font-medium text-sm md:text-base" />
                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1">Password</label>
                                <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-maroon-500/50 bg-slate-50 font-medium text-sm md:text-base" />
                            </div>
                            <div className="pt-2">
                                <button type="submit" disabled={loading} className="w-full py-3 bg-maroon-shine text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-all active:scale-95 disabled:opacity-50 cursor-pointer text-sm md:text-base">
                                    {loading ? 'Memproses...' : 'Login'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ inventory, transactions, masterData }) => {
            const lowStockItems = useMemo(() => {
                if (!masterData || masterData.length === 0) return [];
                return inventory.filter(item => {
                    const master = masterData.find(m => m.id === item.id);
                    return master && master.min > 0 && item.stock <= (master.min + 2);
                }).map(item => ({
                    ...item,
                    ...masterData.find(m => m.id === item.id)
                }));
            }, [inventory, masterData]);

            return (
                <div className="fade-in pb-24">
                    <div className="mb-6 md:mb-8">
                        <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Dashboard</h2>
                        <p className="text-sm md:text-base text-slate-500 mt-1 font-medium">Ringkasan kondisi stok & peringatan</p>
                    </div>
                    
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200/50 p-5 md:p-6 mb-8 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-2 h-full bg-maroon-500"></div>
                        <div className="flex items-center gap-3 mb-5 md:mb-6">
                            <div className="bg-rose-100 p-2 md:p-2.5 rounded-full relative">
                                <div className="absolute inset-0 bg-rose-400 rounded-full animate-ping opacity-30"></div>
                                <Icons.Alert />
                            </div>
                            <div>
                                <h3 className="font-extrabold text-base md:text-lg text-slate-800 leading-tight">Peringatan Stok</h3>
                                <p className="text-[10px] md:text-xs text-rose-600 font-bold mt-0.5 uppercase tracking-wide">Barang dengan stok menipis</p>
                            </div>
                        </div>
                        {lowStockItems.length === 0 ? (
                            <div className="flex flex-col items-center justify-center p-6 md:p-8 bg-slate-50 rounded-2xl border border-slate-200 border-dashed">
                                <div className="w-12 h-12 md:w-14 md:h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-3 md:mb-4 shadow-sm">
                                    <Icons.CheckCircle />
                                </div>
                                <p className="text-xs md:text-sm text-slate-600 font-bold text-center">Semua stok barang dalam kondisi aman atau Master Data belum termuat.</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                                {lowStockItems.map(item => (
                                    <div key={item.id} className="relative p-4 md:p-5 bg-gradient-to-br from-white to-rose-50/30 rounded-2xl border border-rose-100 shadow-sm transition-all duration-300 hover:shadow-md hover:border-rose-300 overflow-hidden group">
                                        <div className="absolute top-0 right-0 w-20 h-20 md:w-24 md:h-24 bg-rose-50 rounded-bl-full -z-10 group-hover:scale-110 transition-transform duration-500"></div>
                                        <div className="flex justify-between items-start mb-3 md:mb-4">
                                            <div className="pr-3 md:pr-4">
                                                <p className="font-extrabold text-slate-800 text-sm md:text-[15px] mb-1.5 md:mb-2 leading-tight">{item.name}</p>
                                                <span className="text-[9px] md:text-[10px] font-mono font-bold bg-slate-100 text-slate-600 px-2 py-1 md:px-2.5 rounded-md border border-slate-200 shadow-sm">{item.code}</span>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <p className={`font-black text-xl md:text-2xl leading-none ${item.stock <= item.min ? 'text-rose-600' : 'text-orange-500'}`}>
                                                    {item.stock} <span className="text-xs md:text-sm font-medium text-slate-500">{item.unit}</span>
                                                </p>
                                                <p className="text-[10px] md:text-xs text-slate-500 font-bold mt-1">Min: {item.min}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Inventory = ({ inventory, setInventory, addTransaction, showMessage, userRole, triggerAutoSync, masterData }) => {
            const [search, setSearch] = useState('');
            const [selectedItem, setSelectedItem] = useState(null);
            const [qty, setQty] = useState('');
            const [modalMode, setModalMode] = useState('');

            const filteredData = (masterData || []).filter(item => 
                item.name.toLowerCase().includes(search.toLowerCase()) || item.code.toLowerCase().includes(search.toLowerCase())
            );

            const handleUpdateStock = (e) => {
                e.preventDefault();
                const amount = parseFloat(qty);
                if (isNaN(amount) || amount <= 0) return showMessage('Error', 'Masukkan jumlah yang valid.', 'error');

                const currentStock = inventory.find(i => i.id === selectedItem.id)?.stock || 0;
                if (modalMode === 'use' && amount > currentStock) return showMessage('Stok Kurang', `Jumlah pemakaian melebihi stok.`, 'error');

                const newStock = modalMode === 'use' ? currentStock - amount : currentStock + amount;

                const updatedInventory = inventory.map(i => i.id === selectedItem.id ? { ...i, stock: newStock } : i);
                if (!inventory.some(i => i.id === selectedItem.id)) {
                    updatedInventory.push({ id: selectedItem.id, stock: newStock });
                }

                setInventory(updatedInventory);
                const newTx = { itemId: selectedItem.id, qty: amount, type: modalMode === 'use' ? 'OUT' : 'IN', date: new Date().toISOString() };
                addTransaction(newTx);
                
                triggerAutoSync({ inventory: updatedInventory });

                setSelectedItem(null); setQty(''); setModalMode('');
                showMessage('Berhasil', 'Stok berhasil diperbarui dan disinkronkan ke Spreadsheet.', 'success');
            };

            const handleShareAllStockWA = () => {
                if (!masterData || masterData.length === 0) return showMessage('Data Kosong', 'Master data belum tersedia, harap sinkronkan.', 'error');
                
                const dateStr = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                let text = `*LAPORAN STOK BARANG CCP*\n`;
                text += `📅 *Tanggal:* ${dateStr}\n`;
                text += `───────────────────\n\n`;

                masterData.forEach(item => {
                    const currentStock = inventory.find(i => i.id === item.id)?.stock || 0;
                    const isLow = item.min > 0 && currentStock <= item.min;
                    const alertIcon = isLow ? '⚠️' : '✅';
                    
                    text += `${alertIcon} *${item.name}*\n`;
                    text += `KODE: ${item.code}\n`;
                    text += `STOK: *${currentStock} ${item.unit}*\n`;
                    text += `MIN STOK: ${item.min}\n\n`;
                });

                text += `───────────────────\n`;
                text += `_Auto-generated by CCP System_`;

                const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            return (
                <div className="fade-in pb-24">
                    <div className="flex justify-between items-center mb-5 md:mb-6">
                        <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Stok Barang</h2>
                        
                        <button onClick={handleShareAllStockWA} className="bg-[#25D366] text-white py-2 px-3 md:py-2.5 md:px-4 rounded-xl shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition flex items-center gap-1.5 md:gap-2">
                            <Icons.WhatsApp />
                            <span className="hidden sm:inline font-bold text-xs md:text-sm">Share Stok</span>
                        </button>

                    </div>

                    {selectedItem && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">

        const Orders = ({ orders, setOrders, showMessage, userRole, triggerAutoSync, masterData }) => {
            const [showNewOrder, setShowNewOrder] = useState(false);
            const [activeSubTab, setActiveSubTab] = useState('proses');
            const [searchTerm, setSearchTerm] = useState('');
            const [isDropdownOpen, setIsDropdownOpen] = useState(false);
            const [selectedItemObj, setSelectedItemObj] = useState(null);
            const [orderNotes, setOrderNotes] = useState('');
            const dropdownRef = useRef(null);

            const STAGES = ["TTD SH", "TTD DH", "TTD FM", "Admin Planner", "Menunggu PO"];

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsDropdownOpen(false); };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [dropdownRef]);

            const filteredItems = (masterData || []).filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()) || item.code.toLowerCase().includes(searchTerm.toLowerCase()));

            const handleNewOrder = (e) => {
                e.preventDefault();
                if (!selectedItemObj) return showMessage('Pilih Barang', 'Silakan pilih barang terlebih dahulu.', 'error');
                const isoDate = new Date().toISOString();
                const newOrder = { 
                    id: Date.now().toString(), 
                    itemId: selectedItemObj.id, 
                    itemName: selectedItemObj.name, 
                    itemCode: selectedItemObj.code, 
                    status: 0, 
                    completed: false, 
                    notes: orderNotes, 
                    date: isoDate,
                    statusHistory: [{ status: 0, date: isoDate }],
                    completedDate: null 
                };
                const updatedOrders = [newOrder, ...orders];
                setOrders(updatedOrders);
                triggerAutoSync({ orders: updatedOrders });

                setShowNewOrder(false); setOrderNotes(''); setSearchTerm(''); setSelectedItemObj(null);
                showMessage('Berhasil', 'Order baru berhasil dibuat dan disinkronkan.', 'success');
            };

            const advanceStatus = (orderId) => {
                const updatedOrders = orders.map(o => {
                    if (o.id === orderId && o.status < STAGES.length - 1) {
                        const newStatus = o.status + 1;
                        const history = o.statusHistory ? [...o.statusHistory] : [{ status: o.status, date: o.date }];
                        history.push({ status: newStatus, date: new Date().toISOString() });
                        return { ...o, status: newStatus, statusHistory: history };
                    }
                    return o;
                });
                setOrders(updatedOrders);
                triggerAutoSync({ orders: updatedOrders });
            };

            const completeOrder = (orderId) => {
                const updatedOrders = orders.map(o => o.id === orderId ? { ...o, completed: true, completedDate: new Date().toISOString() } : o);
                setOrders(updatedOrders);
                triggerAutoSync({ orders: updatedOrders });
                showMessage('Selesai', 'Orderan telah selesai dan disinkronkan.', 'success');
            };

            const activeOrders = orders.filter(o => !o.completed);
            const completedOrders = orders.filter(o => o.completed);
            const displayOrders = activeSubTab === 'proses' ? activeOrders : completedOrders;

            return (
                <div className="fade-in pb-24">
                    <div className="flex justify-between items-center mb-5 md:mb-6">

                        {userRole === 'operator' && (

                                <Icons.Plus />
                            </button>

                    </div>

                    <div className="flex relative bg-slate-200/50 p-1.5 rounded-2xl mb-6 md:mb-8 border border-slate-200/60 shadow-inner">
                        <div className={`absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-white rounded-xl shadow-sm border border-slate-100 transition-transform duration-300 ease-out z-0`} style={{ transform: activeSubTab === 'selesai' ? 'translateX(100%)' : 'translateX(0)' }}></div>
                        <button onClick={() => setActiveSubTab('proses')} className={`relative z-10 flex-1 py-2.5 md:py-3 text-xs md:text-sm font-extrabold rounded-xl transition-colors duration-300 flex items-center justify-center gap-1.5 md:gap-2 ${activeSubTab === 'proses' ? 'text-maroon-800' : 'text-slate-500 hover:text-slate-700'}`}>Proses <span className="px-2 py-0.5 rounded-md text-[9px] md:text-[10px] bg-rose-100 text-maroon-700">{activeOrders.length}</span></button>
                        <button onClick={() => setActiveSubTab('selesai')} className={`relative z-10 flex-1 py-2.5 md:py-3 text-xs md:text-sm font-extrabold rounded-xl transition-colors duration-300 flex items-center justify-center gap-1.5 md:gap-2 ${activeSubTab === 'selesai' ? 'text-emerald-700' : 'text-slate-500 hover:text-slate-700'}`}>Selesai <span className="px-2 py-0.5 rounded-md text-[9px] md:text-[10px] bg-emerald-100 text-emerald-700">{completedOrders.length}</span></button>
                    </div>

                    {showNewOrder && (
                        <div className="bg-white p-5 md:p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200 mb-6 md:mb-8 slide-up relative z-40">
                            <div className="flex justify-between items-center mb-5 border-b border-slate-100 pb-4">
                                <h3 className="font-extrabold text-lg md:text-xl text-slate-800">Buat Order Baru</h3>
                                <button onClick={() => setShowNewOrder(false)} className="text-slate-400 bg-slate-50 p-2 rounded-full"><Icons.Close /></button>
                            </div>
                            <form onSubmit={handleNewOrder}>
                                <div className="mb-4 md:mb-5" ref={dropdownRef}>
                                    <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5 md:mb-2">Cari Barang</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><Icons.Search /></div>
                                        <input type="text" className="w-full pl-10 md:pl-11 pr-4 py-3 md:py-3.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-maroon-500/50 bg-slate-50 font-medium text-xs md:text-sm" placeholder="Ketik nama / kode barang..." value={searchTerm} onChange={(e) => { setSearchTerm(e.target.value); setIsDropdownOpen(true); setSelectedItemObj(null); }} onFocus={() => setIsDropdownOpen(true)} />
                                        {isDropdownOpen && searchTerm && (
                                            <ul className="absolute z-50 w-full bg-white border border-slate-100 mt-2 rounded-xl shadow-2xl max-h-56 overflow-y-auto">
                                                {filteredItems.map(item => (
                                                    <li key={item.id} onClick={() => { setSelectedItemObj(item); setSearchTerm(item.name); setIsDropdownOpen(false); }} className="p-3 hover:bg-rose-50 cursor-pointer border-b border-slate-50 flex flex-col">
                                                        <span className="font-bold text-slate-800 text-xs md:text-sm">{item.name}</span><span className="text-[9px] md:text-[10px] font-mono text-slate-400 mt-0.5">{item.code}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>
                                    {selectedItemObj && (
                                        <div className="mt-3 p-3 md:p-4 bg-gradient-to-r from-rose-50 to-white rounded-xl border border-rose-100 flex justify-between items-center fade-in">
                                            <div><p className="text-[9px] md:text-[10px] text-maroon-600 font-black uppercase tracking-widest mb-1">Terpilih</p><p className="text-xs md:text-sm font-bold text-slate-800">{selectedItemObj.name}</p></div>
                                        </div>
                                    )}
                                </div>
                                <div className="mb-6 md:mb-8">
                                    <label className="block text-xs md:text-sm font-bold text-slate-700 mb-1.5 md:mb-2">Catatan / Qty</label>
                                    <input type="text" required value={orderNotes} onChange={(e) => setOrderNotes(e.target.value)} className="w-full p-3 md:p-3.5 rounded-xl border border-slate-200 bg-slate-50 font-medium text-xs md:text-sm" placeholder="Contoh: 10 Roll, Urgent" />
                                </div>
                                <button type="submit" className="w-full py-3 md:py-4 bg-maroon-shine text-white font-extrabold rounded-xl shadow-md active:scale-95 transition-all text-sm md:text-base">Buat Orderan</button>
                            </form>
                        </div>
                    )}

                    <div className="space-y-4 md:space-y-5">
                        {displayOrders.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-3xl border border-slate-200 border-dashed">
                                <p className="text-slate-500 font-bold text-sm">Kosong.</p>
                            </div>
                        ) : (
                            displayOrders.map(order => (
                                <div key={order.id} className={`bg-white p-5 md:p-6 rounded-3xl shadow-sm border ${order.completed ? 'border-emerald-200/60 bg-gradient-to-br from-white to-emerald-50/20' : 'border-slate-200/60'}`}>
                                    <div className="flex justify-between items-start mb-3 md:mb-4">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1.5 md:mb-2">
                                                <span className="text-[9px] md:text-[10px] font-mono font-bold bg-slate-100 px-2 py-1 md:px-2.5 rounded-md text-slate-600">{order.itemCode}</span>
                                            </div>
                                            <h4 className="font-extrabold text-base md:text-xl text-slate-800 leading-tight mb-1 pr-2 md:pr-4">{order.itemName}</h4>
                                            <p className="text-[10px] md:text-[11px] font-bold text-slate-400 mb-3 flex items-center gap-1">
                                                <Icons.Refresh /> Dibuat: {new Date(order.date).toLocaleString('id-ID', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'})}
                                            </p>
                                            <p className="text-xs md:text-sm text-slate-600 bg-slate-50/80 p-2.5 md:p-3 rounded-xl border border-slate-100 font-medium">Catatan: <span className="font-extrabold text-slate-800">{order.notes}</span></p>
                                        </div>
                                    </div>
                                    
                                    {!order.completed && (
                                        <div className="mt-5 md:mt-6 mb-2">
                                            <div className="flex justify-between items-end mb-1.5 md:mb-2">
                                                <span className="text-[9px] md:text-[10px] font-bold text-slate-500 uppercase">Status Saat Ini</span>
                                                <span className="text-[10px] md:text-xs font-black text-maroon-700 bg-rose-50 px-2 md:px-3 py-1 rounded-full">{STAGES[order.status]}</span>
                                            </div>
                                            <div className="flex gap-1.5 h-2">
                                                {STAGES.map((step, index) => (
                                                    <div key={index} className={`flex-1 rounded-full ${index === order.status ? 'bg-maroon-500 shadow-glow' : index <= order.status ? 'bg-maroon-300' : 'bg-slate-100'}`}></div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-4 bg-slate-50/70 p-3 md:p-4 rounded-2xl border border-slate-100">
                                        <h5 className="text-[9px] md:text-[10px] font-black text-slate-500 uppercase tracking-wider mb-2 md:mb-3">Detail Perubahan Status</h5>
                                        <div className="space-y-2">
                                            {(order.statusHistory || [{status: order.status, date: order.date}]).map((h, idx) => (
                                                <div key={idx} className="flex justify-between items-center">
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-1.5 h-1.5 md:w-2 md:h-2 rounded-full ${idx === (order.statusHistory?.length - 1 || 0) && !order.completed ? 'bg-maroon-500 shadow-glow-sm' : 'bg-slate-300'}`}></div>
                                                        <span className={`font-bold text-xs md:text-sm ${idx === (order.statusHistory?.length - 1 || 0) && !order.completed ? 'text-slate-800' : 'text-slate-500'}`}>{STAGES[h.status]}</span>
                                                    </div>
                                                    <span className="text-[9px] md:text-[10px] font-bold text-slate-500 bg-white px-1.5 py-0.5 md:px-2 md:py-1 rounded-md border border-slate-200/60 shadow-sm">
                                                        {new Date(h.date).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'})}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {!order.completed && userRole === 'operator' && (
                                        <div className="mt-5 md:mt-6 flex flex-col sm:flex-row justify-end gap-2 md:gap-3 pt-4 border-t border-slate-100">
                                            {order.status < STAGES.length - 1 ? (
                                                <button onClick={() => advanceStatus(order.id)} className="w-full sm:w-auto py-2.5 md:py-3 px-4 md:px-6 bg-white border-2 border-slate-200 text-slate-700 rounded-xl text-xs md:text-sm font-extrabold hover:border-maroon-500 hover:text-maroon-700 transition">Lanjut ke {STAGES[order.status + 1]}</button>
                                            ) : (
                                                <button onClick={() => completeOrder(order.id)} className="w-full sm:w-auto py-2.5 md:py-3 px-4 md:px-6 bg-emerald-500 text-white rounded-xl text-xs md:text-sm font-extrabold hover:bg-emerald-600 transition">Selesaikan Pesanan</button>
                                            )}
                                        </div>
                                    )}
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const Handover = ({ handovers, setHandovers, showMessage, userRole, triggerAutoSync, masterActivities }) => {
            const [view, setView] = useState('history'); 
            const [dateStr, setDateStr] = useState(() => new Date().toISOString().split('T')[0]);
            const [shift, setShift] = useState('Shift 1');
            const [stage, setStage] = useState('Stage 1');
            const [selectedLines, setSelectedLines] = useState(['LINE 1']); 
            const [checks, setChecks] = useState({}); 
            const [expandedId, setExpandedId] = useState(null);

            const activeActivities = useMemo(() => {
                if (!masterActivities || masterActivities.length === 0) return [];
                return masterActivities.filter(a => 
                    a.stage === stage && 
                    (a.lines.includes("ALL") || a.lines.some(l => selectedLines.includes(l)))
                );
            }, [stage, selectedLines, masterActivities]);

            const groupedActivities = useMemo(() => {
                const groups = {};
                activeActivities.forEach(item => {
                    if (!groups[item.area]) groups[item.area] = [];
                    groups[item.area].push(item.name);
                });
                return groups;
            }, [activeActivities]);

            useEffect(() => { 
                setChecks({}); 
                setSelectedLines([LINE_OPTIONS[stage][0]]);
            }, [stage]);

            useEffect(() => { setChecks({}); }, [selectedLines.join(',')]); 

            const handleLineClick = (opt) => {
                if (selectedLines.includes(opt)) {
                    if (selectedLines.length > 1) setSelectedLines(prev => prev.filter(l => l !== opt));
                } else {
                    if (selectedLines.length >= 5) showMessage('Info', 'Maksimal 5 Line berjalan dapat dipilih secara bersamaan.', 'error');
                    else setSelectedLines(prev => [...prev, opt]);
                }
            };

            const handleStatusChange = (area, item, status) => { setChecks(prev => ({ ...prev, [`${area}---${item}`]: { ...prev[`${area}---${item}`], status } })); };
            const handleNotesChange = (area, item, notes) => { setChecks(prev => ({ ...prev, [`${area}---${item}`]: { ...prev[`${area}---${item}`], notes } })); };
            
            const setAreaAllOk = (area) => {
                const newChecks = { ...checks };
                groupedActivities[area].forEach(item => {
                    const key = `${area}---${item}`;
                    if (!newChecks[key]) newChecks[key] = { notes: '' };
                    newChecks[key].status = 'OK';
                });
                setChecks(newChecks);
            };

            const handleSubmitForm = () => {
                let isComplete = true;
                for (let area of Object.keys(groupedActivities)) {
                    for (let item of groupedActivities[area]) {
                        if (!checks[`${area}---${item}`] || !checks[`${area}---${item}`].status) { isComplete = false; break; }
                    }
                }
                if (!isComplete) return showMessage('Form Belum Lengkap', 'Harap isi status semua aktivitas untuk Line ini sebelum menyimpan.', 'error');
                
                const lineStr = selectedLines.join(', ');
                const updatedHandovers = [{ id: Date.now().toString(), date: dateStr, shift, stage, line: lineStr, checks, timestamp: new Date().toISOString() }, ...handovers];
                setHandovers(updatedHandovers);
                triggerAutoSync({ handovers: updatedHandovers });

                showMessage('Sukses', 'Laporan berhasil disimpan dan disinkronkan.', 'success');
                setChecks({}); setView('history');
            };

            const toggleExpand = (id) => { if (expandedId === id) setExpandedId(null); else setExpandedId(id); };

            const handleShareWA = (h) => {
                const dateFormated = new Date(h.date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                
                let text = `*LAPORAN SERAH TERIMA CCP*\n`;
                text += `───────────────────\n`;
                text += `📅 *Tanggal:* ${dateFormated}\n`;
                text += `⏰ *Shift:* ${h.shift}\n`;
                text += `🏢 *Stage:* ${h.stage}\n`;
                text += `⚙️ *Line:* ${h.line || "ALL LINE"}\n`;
                text += `───────────────────\n\n`;
                text += `*RINCIAN PENGECEKAN:*\n`;
                
                const allChecks = Object.entries(h.checks || {}).map(([k, v]) => {
                    const [area, item] = k.split('---'); return { area, item, ...v };
                });

                const grouped = {};
                allChecks.forEach(c => {
                    if(!grouped[c.area]) grouped[c.area] = [];
                    grouped[c.area].push(c);
                });

                for (const area in grouped) {
                    text += `\n*${area}*\n`;
                    grouped[area].forEach(c => {
                        const icon = c.status === 'OK' ? '✅' : (c.status === 'NOT OK' ? '❌' : '⚠️');
                        text += `${icon} ${c.item}: ${c.status}`;
                        if (c.notes && c.notes.trim() !== '') text += ` (Catatan: _${c.notes}_)`;
                        text += `\n`;
                    });
                }

                const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                window.open(url, '_blank');
            };

            const { start: weekStart, end: weekEnd } = useMemo(() => {
                const now = new Date();
                const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1; 
                const start = new Date(now);
                start.setDate(now.getDate() - dayOfWeek);
                start.setHours(0, 0, 0, 0);
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                end.setHours(23, 59, 59, 999);
                return { start, end };
            }, []);

            const filteredHandovers = useMemo(() => {
                return handovers.filter(h => {
                    const hDate = new Date(h.date).getTime();
                    return hDate >= weekStart.getTime() && hDate <= weekEnd.getTime();
                });
            }, [handovers, weekStart, weekEnd]);

            if (view === 'history') {
                return (
                    <div className="fade-in pb-24">
                        <div className="flex justify-between items-center mb-4">
                            <div><h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Histori Laporan</h2></div>
                            {userRole === 'operator' && (
                                <button onClick={() => setView('form')} className="bg-white border-2 border-slate-200 text-slate-600 p-2 md:p-2.5 rounded-2xl shadow-sm hover:border-maroon-500 hover:text-maroon-700 transition flex items-center gap-1.5 md:gap-2 font-bold text-xs md:text-sm">
                                    <Icons.Plus /> <span className="hidden sm:inline">Form Baru</span>
                                </button>
                            )}
                        </div>
                        
                        <div className="mb-5 md:mb-6 p-2.5 md:p-3 bg-blue-50 border border-blue-100 rounded-xl flex items-center gap-2">
                            <Icons.Info />
                            <span className="text-[10px] md:text-xs font-bold text-blue-700">Minggu ini: {weekStart.toLocaleDateString('id-ID')} - {weekEnd.toLocaleDateString('id-ID')}</span>
                        </div>

                        <div className="space-y-4">
                            {filteredHandovers.length === 0 ? (
                                <div className="text-center py-12 md:py-16 bg-white rounded-3xl border border-slate-200 border-dashed"><p className="text-slate-500 font-bold text-sm">Belum ada catatan.</p></div> 
                            ) : (
                                filteredHandovers.map(h => {
                                    const allChecks = Object.entries(h.checks || {}).map(([k, v]) => {
                                        const [area, item] = k.split('---'); return { area, item, ...v };
                                    });
                                    const exceptions = allChecks.filter(c => c.status !== 'OK' || c.notes);
                                    const isExpanded = expandedId === h.id;
                                    
                                    return (
                                        <div key={h.id} className="bg-white rounded-3xl shadow-sm border border-slate-200/50 relative overflow-hidden transition-all duration-300">
                                            <div className="absolute top-0 left-0 w-1.5 md:w-2 h-full bg-maroon-600 z-10"></div>
                                            
                                            <div onClick={() => toggleExpand(h.id)} className="p-4 md:p-5 cursor-pointer hover:bg-slate-50/50 transition flex justify-between items-start">
                                                <div>
                                                    <div className="flex flex-wrap gap-1.5 md:gap-2 mb-2">
                                                        <span className="bg-rose-50 text-maroon-700 text-[10px] md:text-xs font-black px-2 md:px-2.5 py-1 rounded-md">{h.stage}</span>
                                                        <span className="bg-amber-50 text-amber-700 text-[10px] md:text-xs font-black px-2 md:px-2.5 py-1 rounded-md">{h.line || "ALL LINE"}</span>
                                                        <span className="bg-slate-100 text-slate-600 text-[10px] md:text-xs font-bold px-2 md:px-2.5 py-1 rounded-md">{h.shift}</span>
                                                    </div>
                                                    <p className="font-extrabold text-slate-800 text-sm md:text-base">{new Date(h.date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                                    
                                                    {!isExpanded && (
                                                        <div className="mt-2 flex items-center gap-2">
                                                            <span className="text-[9px] md:text-[10px] font-bold text-slate-500">{allChecks.length} Aktivitas.</span>
                                                            {exceptions.length > 0 ? (
                                                                <span className="text-[9px] md:text-[10px] font-black text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full">{exceptions.length} Catatan</span>
                                                            ) : (
                                                                <span className="text-[9px] md:text-[10px] font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">Semua OK</span>
                                                            )}
                                                        </div>
                                                    )}

                                                    <div className="mt-3 md:mt-4 flex">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); handleShareWA(h); }} 
                                                            className="flex items-center gap-1.5 bg-[#25D366] text-white px-2.5 py-1.5 md:px-3 md:py-2 rounded-xl text-[10px] md:text-[11px] font-extrabold shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all active:scale-95"
                                                        >
                                                            <Icons.WhatsApp /> Share Laporan
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="text-slate-400 mt-1">
                                                    {isExpanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                                                </div>
                                            </div>

                                            <div className={`accordion-content bg-slate-50 border-t border-slate-100 ${isExpanded ? 'max-h-[3000px] opacity-100 p-4 md:p-5' : 'max-h-0 opacity-0 p-0'}`}>
                                                <div className="mb-3 md:mb-4">
                                                    <h4 className="text-[10px] md:text-xs font-black text-slate-500 uppercase tracking-wider mb-2 md:mb-3">Rincian Pengecekan ({allChecks.length})</h4>
                                                </div>
                                                <div className="space-y-2.5 md:space-y-3">
                                                    {allChecks.map((check, idx) => (
                                                        <div key={idx} className={`rounded-xl p-2.5 md:p-3 border ${check.status === 'OK' ? 'bg-white border-slate-100' : 'bg-rose-50/50 border-rose-100'}`}>
                                                            <div className="flex justify-between items-start">
                                                                <div>
                                                                    <p className="text-[9px] md:text-[10px] text-slate-400 font-bold mb-0.5">{check.area}</p>
                                                                    <p className="text-xs md:text-sm font-bold text-slate-800 leading-tight pr-2">{check.item}</p>
                                                                </div>
                                                                <span className={`shrink-0 text-[9px] md:text-[10px] font-black px-1.5 md:px-2 py-0.5 md:py-1 rounded-md ${check.status === 'OK' ? 'bg-emerald-100 text-emerald-700' : check.status === 'NOT OK' ? 'bg-rose-500 text-white shadow-md' : 'bg-amber-400 text-white shadow-md'}`}>
                                                                    {check.status}
                                                                </span>
                                                            </div>
                                                            {check.notes && (
                                                                <p className="text-[10px] md:text-xs font-medium text-slate-600 bg-white p-1.5 md:p-2 rounded-lg border border-slate-200 mt-2 italic shadow-sm">
                                                                    "{check.notes}"
                                                                </p>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>
                );
            }

            const totalItems = activeActivities.length;
            const completedItems = Object.keys(checks).filter(k => checks[k].status).length;
            const progress = totalItems === 0 ? 0 : (completedItems / totalItems) * 100;

            return (
                <div className="fade-in pb-32">
                    <div className="flex justify-between items-center mb-5 md:mb-6">
                        <div><h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Serah Terima</h2></div>
                        <button onClick={() => setView('history')} className="bg-white border-2 border-slate-200 px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-xs md:text-sm font-bold hover:bg-slate-50 transition">Lihat Histori</button>
                    </div>
                    
                    <div className="bg-white p-4 md:p-5 rounded-3xl shadow-sm border border-slate-200/50 mb-5 md:mb-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2 md:gap-3 mb-3 md:mb-4">
                            <div>
                                <label className="block text-[9px] md:text-[10px] font-bold text-slate-500 mb-1 md:mb-1.5">Tanggal</label>
                                <input type="date" value={dateStr} onChange={e => setDateStr(e.target.value)} className="w-full p-2 md:p-2.5 rounded-xl border bg-slate-50 font-bold text-[11px] md:text-xs" />
                            </div>
                            <div>
                                <label className="block text-[9px] md:text-[10px] font-bold text-slate-500 mb-1 md:mb-1.5">Shift</label>
                                <select value={shift} onChange={e => setShift(e.target.value)} className="w-full p-2 md:p-2.5 rounded-xl border bg-slate-50 font-bold text-[11px] md:text-xs">
                                    <option>Shift 1</option><option>Shift 2</option><option>Shift 3</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-[9px] md:text-[10px] font-bold text-slate-500 mb-1 md:mb-1.5">Pilih Stage</label>
                                <select value={stage} onChange={e => setStage(e.target.value)} className="w-full p-2 md:p-2.5 rounded-xl border bg-rose-50 text-maroon-700 font-black text-[11px] md:text-xs">
                                    <option>Stage 1</option><option>Stage 2</option>
                                </select>
                            </div>
                        </div>

                        <div className="border-t border-slate-100 pt-2 md:pt-3">
                            <label className="block text-[9px] md:text-[10px] font-bold text-slate-500 mb-1.5 md:mb-2">Pilih Line (Maksimal 5 Line)</label>
                            <div className="flex flex-wrap gap-1.5 md:gap-2">
                                {LINE_OPTIONS[stage].map(opt => {
                                    const isActive = selectedLines.includes(opt);
                                    return (
                                        <button 
                                            key={opt} 
                                            onClick={() => handleLineClick(opt)} 
                                            className={`px-3 py-2 md:px-4 md:py-2.5 rounded-xl text-[10px] md:text-xs font-extrabold transition-all duration-300 ${isActive ? 'bg-amber-500 text-white shadow-md shadow-amber-500/30 scale-105' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                        >
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="mt-4 md:mt-5 flex items-center gap-2 md:gap-3">
                            <div className="flex-1 bg-slate-100 rounded-full h-1.5 md:h-2">
                                <div className="bg-maroon-500 h-1.5 md:h-2 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                            </div>
                            <span className="text-[9px] md:text-[10px] font-black text-slate-500 whitespace-nowrap">{completedItems} / {totalItems}</span>
                        </div>
                    </div>

                    <div className="space-y-4 md:space-y-6">
                        {!masterActivities || masterActivities.length === 0 ? (
                            <div className="text-center py-10 bg-white rounded-3xl border border-slate-200 border-dashed">
                                <p className="text-slate-500 font-bold text-sm">Data Aktivitas belum termuat. Silakan Sinkronkan.</p>
                            </div>
                        ) : Object.keys(groupedActivities).length === 0 ? (
                             <div className="text-center py-10 bg-white rounded-3xl border border-slate-200 border-dashed">
                                 <p className="text-slate-500 font-bold text-sm">Tidak ada aktivitas untuk line ini di {stage}.</p>
                             </div>
                        ) : (
                            Object.entries(groupedActivities).map(([areaName, activities]) => (
                                <div key={areaName} className="bg-white rounded-3xl border border-slate-200/60 overflow-hidden shadow-sm">
                                    <div className="bg-slate-50/80 px-4 md:px-5 py-3 md:py-4 border-b flex justify-between items-center">
                                        <h3 className="font-extrabold text-base md:text-lg text-slate-800">{areaName}</h3>
                                        <button onClick={() => setAreaAllOk(areaName)} className="text-[10px] md:text-xs font-black border border-emerald-200 bg-emerald-50 text-emerald-600 px-3 py-1.5 md:px-4 md:py-2 rounded-xl hover:bg-emerald-100 transition">Set OK Semua</button>
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {activities.map((item, index) => {
                                            const key = `${areaName}---${item}`; 
                                            const itemState = checks[key] || { status: null, notes: '' };
                                            return (
                                                <div key={index} className="p-4 md:p-5">
                                                    <p className="font-bold text-slate-700 text-sm md:text-base mb-2 md:mb-3">{item}</p>
                                                    <div className="flex gap-1.5 md:gap-2 mb-2 md:mb-3">
                                                        {['OK', 'NOT OK', 'ADA PERGANTIAN'].map(opt => (
                                                            <button key={opt} onClick={() => handleStatusChange(areaName, item, opt)} className={`flex-1 py-1.5 md:py-2 text-[10px] md:text-xs font-black rounded-xl transition-all shadow-sm ${itemState.status === opt ? (opt === 'OK' ? 'bg-emerald-500 text-white' : opt === 'NOT OK' ? 'bg-rose-500 text-white' : 'bg-amber-500 text-white') : 'bg-slate-100 text-slate-500 hover:bg-slate-200 border border-slate-200/60'}`}>{opt === 'ADA PERGANTIAN' ? 'PERGANTIAN' : opt}</button>
                                                        ))}
                                                    </div>
                                                    <input type="text" placeholder="Catatan tambahan (jika ada)..." value={itemState.notes} onChange={(e) => handleNotesChange(areaName, item, e.target.value)} className="w-full p-2.5 md:p-3 rounded-xl border border-slate-200 bg-slate-50 text-xs md:text-sm font-medium focus:ring-2 focus:ring-maroon-500/30 outline-none transition" />
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                    
                    {totalItems > 0 && (
                        <div className="fixed bottom-[88px] left-0 w-full px-4 md:px-8 max-w-4xl mx-auto left-1/2 -translate-x-1/2 z-30 pointer-events-none">
                            <button onClick={handleSubmitForm} className="w-full py-3.5 md:py-4 bg-maroon-shine text-white rounded-2xl font-black shadow-lg pointer-events-auto flex justify-center items-center gap-2 hover:shadow-xl transition-all active:scale-95 text-sm md:text-base"><Icons.Handshake /> Simpan Laporan</button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useLocalStorage('ccp_user', null);
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [message, setMessage] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);

            // Ganti MASTER_DATA default hardcode menjadi state kosong awalnya. Akan difetch dari backend.
            const [masterData, setMasterData] = useLocalStorage('ccp_master_barang', []);
            const [masterActivities, setMasterActivities] = useLocalStorage('ccp_master_aktivitas', []);

            const [inventory, setInventory] = useLocalStorage('ccp_inventory_v5', []);
            const [transactions, setTransactions] = useLocalStorage('ccp_transactions_v5', []);
            const [orders, setOrders] = useLocalStorage('ccp_orders_v5', []);
            const [handovers, setHandovers] = useLocalStorage('ccp_handovers_v5', []); 

            const addTransaction = (t) => setTransactions(prev => [t, ...prev]);
            const showMessage = (title, text, type = 'info') => setMessage({ title, text, type });

            const triggerAutoSync = useCallback(async (partialData) => {
                if (!SCRIPT_URL || SCRIPT_URL.includes("ISI_URL") || SCRIPT_URL.trim() === "") return;
                const fullData = { inventory, transactions, orders, handovers, ...partialData };
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'push', role: user?.role || 'operator', data: fullData })
                    });
                } catch (err) { console.error("Auto-sync bg error:", err); }
            }, [inventory, transactions, orders, handovers, user]);

            const handleDirectSync = async (silent = false) => {
                if (!SCRIPT_URL || SCRIPT_URL.includes("ISI_URL") || SCRIPT_URL.trim() === "") {
                    if (!silent) showMessage('Mode Offline', 'URL Apps Script belum terkonfigurasi.', 'info');
                    return;
                }
                setIsSyncing(true);
                try {
                    const response = await fetch(SCRIPT_URL);
                    const result = await response.json();
                    if (result.status === 'success' && result.data) {
                        if (result.data.inventory) setInventory(result.data.inventory);
                        if (result.data.transactions) setTransactions(result.data.transactions);
                        if (result.data.orders) setOrders(result.data.orders);
                        if (result.data.handovers) setHandovers(result.data.handovers);
                        
                        // NEW: Ambil Master Data
                        if (result.data.masterBarang) setMasterData(result.data.masterBarang);
                        if (result.data.aktivitasStage) setMasterActivities(result.data.aktivitasStage);

                        if (!silent) showMessage('Berhasil', 'Data dan Master Data telah disinkronkan dengan Google Spreadsheet.', 'success');
                    } else throw new Error(result.message || "Data kosong/format tidak sesuai.");
                } catch (err) { 
                    if (!silent) showMessage('Gagal', err.message || 'Periksa koneksi internet Anda.', 'error'); 
                    console.error("Sync error:", err);
                } 
                finally { setIsSyncing(false); }
            };

            const handleLogin = (role, username) => {
                setUser({ role, username });
                setTimeout(() => {
                    handleDirectSync(true);
                }, 500);
            };

            const handleLogout = () => { setUser(null); setActiveTab('dashboard'); };

            if (!user) return <Login onLogin={handleLogin} showMessage={showMessage} />;

            const renderContent = () => {
                switch(activeTab) {
                    case 'dashboard': return <Dashboard inventory={inventory} transactions={transactions} masterData={masterData} />;
                    case 'inventory': return <Inventory inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} showMessage={showMessage} userRole={user.role} triggerAutoSync={triggerAutoSync} masterData={masterData} />;
                    case 'orders': return <Orders orders={orders} setOrders={setOrders} showMessage={showMessage} userRole={user.role} triggerAutoSync={triggerAutoSync} masterData={masterData} />;
                    case 'handover': return <Handover handovers={handovers} setHandovers={setHandovers} showMessage={showMessage} userRole={user.role} triggerAutoSync={triggerAutoSync} masterActivities={masterActivities} />;
                    default: return <Dashboard inventory={inventory} transactions={transactions} masterData={masterData} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col text-slate-800 font-sans selection:bg-maroon-200">
                    <MessageBox message={message} onClose={() => setMessage(null)} />

                    <header className="glass-panel p-3 md:p-4 sticky top-0 z-[40] shadow-sm flex items-center justify-between">
                        <div className="flex items-center gap-2 md:gap-3">
                            <Icons.Logo />
                            <div className="text-left">
                                <h1 className="text-lg md:text-xl font-extrabold text-slate-800 tracking-tight leading-none">CCP System</h1>
                                <p className="text-[9px] md:text-[10px] text-maroon-600 font-black uppercase tracking-widest mt-0.5">{user.role}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-1.5 md:gap-2">
                            <button 
                                onClick={() => handleDirectSync(false)} disabled={isSyncing}
                                className="flex items-center gap-1.5 px-2.5 py-1.5 md:px-3 md:py-2 bg-slate-100 rounded-full text-slate-700 hover:bg-slate-200 shadow-sm transition font-bold text-[10px] md:text-xs disabled:opacity-50 cursor-pointer"
                            >
                                <span className={isSyncing ? "animate-spin-custom" : ""}><Icons.Refresh /></span>
                                <span className="hidden sm:inline">{isSyncing ? 'Menyinkronkan...' : 'Sinkronkan'}</span>
                            </button>
                            <button onClick={handleLogout} className="p-1.5 md:p-2 bg-rose-50 rounded-full text-rose-600 hover:bg-rose-100 shadow-sm transition ml-0.5 md:ml-1"><Icons.Logout /></button>
                        </div>
                    </header>

                    <main className="flex-1 p-3 md:p-8 max-w-4xl mx-auto w-full pb-32">
                        {renderContent()}
                    </main>

                    <div className="fixed bottom-4 md:bottom-6 left-0 w-full flex justify-center px-3 md:px-4 z-[50] pointer-events-none">
                        <nav className="pointer-events-auto bg-white/95 backdrop-blur-xl border border-slate-100 flex justify-around p-1.5 md:p-2 shadow-2xl rounded-3xl w-full max-w-md ring-1 ring-slate-900/5">
                            {[
                                { id: 'dashboard', icon: <Icons.Home />, label: 'Beranda' },
                                { id: 'inventory', icon: <Icons.Box />, label: 'Stok' },
                                { id: 'orders', icon: <Icons.Clipboard />, label: 'Orderan' },
                                { id: 'handover', icon: <Icons.Handshake />, label: 'Laporan' },
                            ].map(item => (
                                <button 
                                    key={item.id} onClick={() => setActiveTab(item.id)} 
                                    className={`flex flex-col items-center p-2 md:p-2.5 w-14 md:w-16 transition-all ${activeTab === item.id ? 'text-maroon-700 scale-105' : 'text-slate-400 hover:text-slate-600'}`}
                                >
                                    {item.icon}
                                    <span className="text-[9px] md:text-[10px] mt-0.5 md:mt-1 font-bold">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('Service Worker terdaftar di Scope:', reg.scope);
                }).catch(err => {
                    console.warn('Gagal mendaftar Service Worker:', err);
                });
            });
        }
    </script>
</body>
</html>
